events {}

http {
    # Docker's embedded DNS. Re-resolving the `workload` service name every
    # second means nginx round-robins over the CURRENT set of replicas as they
    # scale up and down — no reload needed.
    resolver 127.0.0.11 valid=1s ipv6=off;

    server {
        listen 80;

        location / {
            # Using a variable forces per-request DNS resolution (dynamic
            # discovery) and a fresh backend connection, so load spreads evenly
            # instead of sticking to one replica via keep-alive.
            set $backend "workload:8080";
            proxy_pass http://$backend;

            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
        }
    }
}